name: Android APK uret
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Bagimliliklari kur
        working-directory: mobile
        run: npm install
      - name: Android projesini olustur
        working-directory: mobile
        run: npx cap add android
      - name: Uygulama kodunu yerlestir
        working-directory: mobile
        run: cp MainActivity.java.template android/app/src/main/java/com/baykutay/klipstudyo/MainActivity.java
      - name: APK derle
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KlipStudyo-Android-APK
          path: mobile/android/app/build/outputs/apk/debug/*.apk
